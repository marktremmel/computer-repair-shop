<title>TechOps Budapest · Repair Shop Simulator</title>
<meta name="description" content="Run an IT repair shop. Diagnose hidden faults with real instruments, choose between cheap, used, retail and genuine parts, and answer to the customer who has to live with your decision.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
<link rel="stylesheet" href="css/shop.css?v=0ea08f31">
<link rel="stylesheet" href="css/bench.css?v=0ea08f31">
</head>
<body>
<script>window.TECHOPS_BUILD="0ea08f31";</script>

<div id="title-screen" class="title"></div>

<div id="shopdrop"></div>

<header class="topbar">
  <a class="brand" href="./" title="Back to the materials index">
    <span class="brand-mark" id="brand-mark"><i data-ic="repair"></i></span>
    <span>
      <span class="brand-name">TechOps <span>Budapest</span></span><br>
      <span class="brand-sub">Repair shop simulator</span>
    </span>
  </a>

  <div class="hud">
    <div class="hud-stat"><i data-ic="calendar"></i><span class="lbl">Day</span><b id="hud-day">1</b></div>
    <div class="hud-stat" title="The working day burns down as you spend bench hours"><i data-ic="clock"></i><b class="hud-clock" id="hud-clock">09:00</b><span id="hud-phase">morning</span></div>
    <div class="hud-stat hud-cash" id="hud-cash"><i data-ic="coin"></i><span class="lbl">Till</span><b>—</b></div>
    <div class="hud-stat"><span class="lbl">Jobs</span><b id="hud-jobs">0</b></div>
    <div class="hud-stat"><i data-ic="star"></i><span class="lbl">Avg</span><b id="hud-stars">—</b></div>
    <div class="hud-stat" title="Reputation decides who walks through the door">
      <span class="lbl">Rep</span>
      <span class="rep-meter"><span class="rep-fill" id="rep-fill" style="width:50%"></span></span>
      <b id="hud-rep-n">50</b>
    </div>
    <div class="hud-stat" id="player-chip" style="display:none;gap:7px;cursor:pointer" title="You &amp; your shop — profile, appearance and sign"></div>
    <button class="icon-btn" id="btn-save" title="Save &amp; load shift (carry progress to another computer)"><i data-ic="save"></i></button>
    <button class="icon-btn" id="btn-report" title="Teacher report &amp; hand-in code"><i data-ic="report"></i></button>
    <button class="icon-btn" id="btn-badges" title="Shop record, history &amp; badges"><i data-ic="medal"></i></button>
    <button class="icon-btn" id="btn-breather" title="Take five"><i data-ic="coffee"></i></button>
    <button class="icon-btn" id="btn-hints" title="Hints"><i data-ic="search"></i></button>
    <button class="icon-btn" id="btn-help" title="How the shop works"><i data-ic="question"></i></button>
    <button class="icon-btn" id="btn-access" title="Text size, contrast and movement" aria-label="Access settings"><i data-ic="access"></i></button>
    <button class="icon-btn" id="btn-mute" title="Sound"><i data-ic="speaker"></i></button>
  </div>
</header>

<div class="workspace">

  <aside class="rail" id="rail"></aside>

  <section class="stage">
    <nav class="stage-nav">
      <button class="snav active" data-view="counter"><i data-ic="counter"></i><span>Counter</span></button>
      <button class="snav" data-view="intake"><i data-ic="chat"></i><span>The sit-down</span></button>
      <button class="snav" data-view="bench"><i data-ic="bench"></i><span>Workbench</span></button>
      <button class="snav" data-view="mac"><i data-ic="laptop"></i><span>Software lab</span></button>
      <button class="snav" data-view="market"><i data-ic="parts"></i><span>Parts market</span></button>
      <button class="snav" data-view="handover"><i data-ic="handover"></i><span>Handover</span></button>
      <button class="snav" data-view="chipid"><i data-ic="memory"></i><span>Chip ID</span></button>
      <button class="snav" data-view="shopfit"><i data-ic="box"></i><span>The shop</span></button>
    </nav>

    <div class="stage-body">
      <div class="view active" id="view-counter"></div>
      <div class="view" id="view-intake"></div>
      <div class="view" id="view-bench"></div>
      <div class="view" id="view-mac"></div>
      <div class="view" id="view-market"></div>
      <div class="view" id="view-handover"></div>
      <div class="view" id="view-chipid"></div>
      <div class="view" id="view-shopfit"></div>
    </div>
  </section>

</div>

<div id="toasts"></div>
